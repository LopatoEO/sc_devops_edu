apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-app.configName" . }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "devops-app.postgresqlName" . | quote }}
  DB_PORT: {{ .Values.postgresql.port | quote }}
  REDIS_URL: {{ printf "redis://%s:%v/0" (include "devops-app.redisName" .) .Values.redis.port | quote }}
  EVENTS_CACHE_TTL: {{ .Values.api.eventsCacheTtl | quote }}

