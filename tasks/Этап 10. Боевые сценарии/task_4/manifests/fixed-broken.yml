apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-demo

spec:
  replicas: 2
  minReadySeconds: 30

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: readiness-demo

  template:
    metadata:
      labels:
        app: readiness-demo
        version: fixed-broken

    spec:
      containers:
        - name: app
          image: python:3.12-alpine

          env:
            - name: APP_STATUS
              value: "503"
            - name: READINESS_MODE
              value: "status"

          ports:
            - containerPort: 8000

          command:
            - python
            - -c
            - |
              import os
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              status = int(os.environ.get("APP_STATUS", "200"))

              class Handler(BaseHTTPRequestHandler):
                  timeout = 5
                  def do_GET(self):
                      if self.path == "/readyz":
                          ready = 200 if os.environ.get("READINESS_MODE", "always") == "always" else status
                          self.send_response(ready)
                          self.end_headers()
                          self.wfile.write(b"READY")
                          return

                      print(f"request path={self.path} status={status}", flush=True)
                      self.send_response(status)
                      self.end_headers()
                      self.wfile.write(
                          f"APP STATUS: {status}\n".encode()
                      )

                  def log_message(self, format, *args):
                      pass

              ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000

            initialDelaySeconds: 1
            periodSeconds: 2

---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo

spec:
  selector:
    app: readiness-demo

  ports:
    - port: 8000
      targetPort: 8000
