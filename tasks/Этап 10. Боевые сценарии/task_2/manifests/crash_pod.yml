apiVersion: v1
kind: Pod
metadata:
  name: crashloop-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Application starting..."
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "FATAL: DATABASE_URL is missing"
            sleep 2
            exit 1
          fi
          echo "Configuration loaded"
          sleep 3600
