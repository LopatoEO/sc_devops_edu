apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  labels:
    app: worker

spec:
  replicas: 3

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: elopato/devops-edu-worker:v1.0 
          imagePullPolicy: IfNotPresent
          envFrom:
          - configMapRef:
              name: api-config
          - secretRef:
              name: app-secret          