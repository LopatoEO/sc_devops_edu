apiVersion: apps/v1
kind: Deployment

metadata:
  name: api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: elopato/devops-edu-api:v1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: app-secret

          volumeMounts:
            - name: config-files
              mountPath: /etc/app-config
              readOnly: true

            - name: secret-files
              mountPath: /etc/app-secret
              readOnly: true

      volumes:
        - name: config-files
          configMap:
            name: api-config
        - name: secret-files
          secret:
            secretName: app-secret
