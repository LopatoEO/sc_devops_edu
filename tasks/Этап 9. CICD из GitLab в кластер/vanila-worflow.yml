name: CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NAMESPACE: default

jobs:
  build:
    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          IMAGE_NAME="ghcr.io/${REPOSITORY}-${{ matrix.service }}"

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Building:"
          echo "$IMAGE_NAME"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

          cache-from: |
            type=gha,scope=${{ matrix.service }}

          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Minikube

    needs:
      - build

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Configure PATH
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"


      - name: Check Kubernetes cluster
        shell: bash
        run: |
          echo "=== Context ==="
          kubectl config current-context

          echo
          echo "=== Nodes ==="
          kubectl get nodes

      - name: Wait for ingress controller
        shell: bash
        run: |
          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=available \
            deployment/ingress-nginx-controller \
            --timeout=180s

      - name: Create GHCR pull secret
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

      - name: Configure image pull secret
        shell: bash
        run: |
          kubectl patch serviceaccount default \
            --namespace "$NAMESPACE" \
            --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

          echo "=== ServiceAccount ==="

          kubectl get serviceaccount default \
            --namespace "$NAMESPACE" \
            -o yaml

      - name: Prepare deployment image names
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          API_IMAGE="ghcr.io/${REPOSITORY}-api:${GITHUB_SHA}"
          WORKER_IMAGE="ghcr.io/${REPOSITORY}-worker:${GITHUB_SHA}"

          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

          echo "API image:"
          echo "$API_IMAGE"

          echo "Worker image:"
          echo "$WORKER_IMAGE"

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          kubectl apply \
            --namespace "$NAMESPACE" \
            -f manifests/

      - name: Update API image
        shell: bash
        run: |
          kubectl set image deployment/api \
            api="$API_IMAGE" \
            --namespace "$NAMESPACE"

      - name: Update Worker image
        shell: bash
        run: |
          kubectl set image deployment/worker \
            worker="$WORKER_IMAGE" \
            --namespace "$NAMESPACE"

      - name: Wait for API rollout
        shell: bash
        run: |
          kubectl rollout status deployment/api \
            --namespace "$NAMESPACE" \
            --timeout=180s

      - name: Wait for Worker rollout
        shell: bash
        run: |
          kubectl rollout status deployment/worker \
            --namespace "$NAMESPACE" \
            --timeout=180s

      - name: Show deployment status
        shell: bash
        run: |
          echo "=============================="
          echo "PODS"
          echo "=============================="

          kubectl get pods \
            --namespace "$NAMESPACE" \
            -o wide

          echo
          echo "=============================="
          echo "DEPLOYMENTS"
          echo "=============================="

          kubectl get deployments \
            --namespace "$NAMESPACE"

          echo
          echo "=============================="
          echo "SERVICES"
          echo "=============================="

          kubectl get services \
            --namespace "$NAMESPACE"

          echo
          echo "=============================="
          echo "INGRESS"
          echo "=============================="

          kubectl get ingress \
            --namespace "$NAMESPACE"

          echo
          echo "=============================="
          echo "API IMAGE"
          echo "=============================="

          kubectl get deployment api \
            --namespace "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          echo
          echo "=============================="
          echo "WORKER IMAGE"
          echo "=============================="

          kubectl get deployment worker \
            --namespace "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'