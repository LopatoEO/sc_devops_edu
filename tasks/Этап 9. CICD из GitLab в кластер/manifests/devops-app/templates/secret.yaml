{{- if .Values.postgresql.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-app.databaseSecretName" . }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgresql.auth.password is required when postgresql.secret.create=true" .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
{{- end }}

