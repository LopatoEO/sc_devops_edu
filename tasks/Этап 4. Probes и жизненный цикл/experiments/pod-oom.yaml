apiVersion: v1
kind: Pod
metadata:
  name: api-oom-demo
  labels:
    experiment: oom
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: elopato/devops-edu-api:v1.0
      imagePullPolicy: IfNotPresent
      command: [python, -u, -c]
      args:
        - |
          import time
          print("Allocating 128 MiB with a 32 MiB memory limit", flush=True)
          time.sleep(2)
          payload = bytearray(128 * 1024 * 1024)
          time.sleep(60)
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
