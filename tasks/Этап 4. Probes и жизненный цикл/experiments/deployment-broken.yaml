apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-probes-broken

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-probes-broken

  template:
    metadata:
      labels:
        app: api-probes-broken

    spec:
      containers:
        - name: api
          image: elopato/devops-edu-api:v1.2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: app-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
